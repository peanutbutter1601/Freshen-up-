<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Freshen Up">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Freshen Up – App Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2B5B}a:hover{color:#151E42}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#F6F4EF;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1A1F36;-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.app button{font-family:inherit}
.dark{background:#0E1530;color:#fff}
.scroll{position:absolute;top:0;left:0;right:0;bottom:76px;overflow-y:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:16px}
.scroll.full{bottom:0}
.scroll.withbar{bottom:156px}
.scroll::-webkit-scrollbar{display:none}
.scroll > *{flex-shrink:0}
.btn.off{opacity:.4}
.hdr{display:flex;align-items:center;gap:10px;min-height:40px}
.back{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #E4E1D9;display:flex;align-items:center;justify-content:center;color:#1F2B5B;cursor:pointer;flex:none;padding:0}
.back.off{opacity:.35;cursor:default}
.back.dk{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.ico{width:20px;height:20px;flex:none}
.ico.s{width:16px;height:16px}
.ico.xs{width:13px;height:13px}
.ico.l{width:26px;height:26px}
.h1{font-size:20px;font-weight:600;letter-spacing:-.3px;margin:0}
.sec{font-size:15px;font-weight:600;margin:0;color:#1A1F36}
.lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#5F647A;font-weight:600;margin:0}
.muted{color:#5F647A}
.card{background:#fff;border-radius:16px;border:1px solid #ECE9E2;box-shadow:0 1px 2px rgba(20,24,40,.04)}
.navy{background:#1F2B5B;color:#fff;border-radius:16px;box-shadow:0 8px 20px rgba(31,43,91,.22)}
.btn{height:50px;border-radius:12px;background:#1F2B5B;color:#fff;border:0;font-size:14px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn.green{background:#1FAE5B}
.btn.ghost{background:#fff;color:#1F2B5B;border:1px solid #D6D3CB}
.btn.ghost.on{background:#E7F6EC;border-color:#1FAE5B;color:#167A41}
.btn:disabled{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px}
.pill.green{background:#E7F6EC;color:#167A41;border:1px solid #BFE6CC}
.svcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.svc{position:relative;text-align:left;background:#fff;border:1px solid #ECE9E2;border-radius:16px;padding:14px;height:132px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#1A1F36;box-shadow:0 1px 2px rgba(20,24,40,.04)}
.svc.pop{background:#1F2B5B;color:#fff;border-color:#1F2B5B}
.svc .ib{width:34px;height:34px;border-radius:10px;background:#F1F0EC;display:flex;align-items:center;justify-content:center;color:#1F2B5B}
.svc.pop .ib{background:rgba(255,255,255,.14);color:#fff}
.svc .price{position:absolute;top:14px;right:14px;font-size:12px;font-weight:600;background:#F1F0EC;border-radius:999px;padding:3px 9px;color:#1A1F36}
.svc.pop .price{background:#fff;color:#1F2B5B}
.svc .nm{font-size:14px;font-weight:600;line-height:1.3}
.svc .sub{font-size:11px;opacity:.75;margin-top:2px}
.promo{display:flex;gap:12px;overflow-x:auto;padding-bottom:2px}
.promo::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #DDDAD2;background:#fff;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;color:#1A1F36;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px}
.chip small{font-size:10px;font-weight:500;color:#5F647A}
.chip.on{background:#1F2B5B;border-color:#1F2B5B;color:#fff}
.chip.on small{color:#D5D9EA}
.chip.fixed{cursor:default}
.chip.t{font-size:12px;white-space:nowrap;padding:10px 4px;min-width:0}
.grp{font-size:11px;font-weight:600;color:#5F647A;margin:2px 0 -2px}
.lng{border:0;background:none;font-size:10px;font-weight:600;padding:4px 8px;border-radius:999px;color:#5F647A;cursor:pointer}
.lng.on{background:#1F2B5B;color:#fff}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #ECE9E2;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.navbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#80859A;cursor:pointer;width:64px;height:56px}
.navbtn.on{color:#1F2B5B;font-weight:600}
.navbtn:focus:not(:focus-visible){outline:none}
.fab{width:56px;height:56px;border-radius:50%;background:#1F2B5B;border:4px solid #fff;box-shadow:0 6px 16px rgba(31,43,91,.3);margin-top:-30px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.botbar{position:absolute;left:0;right:0;bottom:76px;padding:12px 18px;background:#F6F4EF;border-top:1px solid #ECE9E2;display:flex;gap:10px}
.toast{position:absolute;left:18px;right:18px;top:18px;background:#1A1F36;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:5}
.lk{width:12px;height:12px;border-radius:3px;background:#E5484D}
.lk.free{background:#1FAE5B}
.step{display:flex;gap:14px;position:relative;padding-bottom:22px}
.step:last-child{padding-bottom:0}
.dot{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative;z-index:1}
.dot.done{background:#1FAE5B;color:#fff}
.dot.cur{background:#fff;border:2px solid #1F2B5B;color:#1F2B5B}
.dot.pend{background:#F1F0EC;color:#80859A;border:1px solid #DDDAD2}
.line{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#E4E1D9}
.line.done{background:#1FAE5B}
.st-title{font-size:14px;font-weight:600}
.st-title.pend{color:#80859A}
.st-sub{font-size:12px;color:#5F647A;margin-top:2px}
.st-tag{font-size:11px;font-weight:600;margin-top:4px}
.star{background:none;border:0;padding:2px;cursor:pointer;color:#D9D7D0}
.star.on{color:#F5B301}
.tag{border:1px solid #DDDAD2;background:#fff;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:500;color:#1A1F36;cursor:pointer}
.tag.on{background:#1F2B5B;border-color:#1F2B5B;color:#fff}
.topup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tu{background:#fff;border:1px solid #DDDAD2;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;color:#1A1F36}
.tu b{display:block;font-size:14px;font-weight:600}
.tu span{font-size:11px;color:#167A41;font-weight:600}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F0EEE8}
.set:last-child{border-bottom:0}
.toggle{width:44px;height:26px;border-radius:999px;background:#D9D7D0;border:0;position:relative;cursor:pointer;padding:0}
.toggle.on{background:#1F2B5B}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on i{left:21px}
.vf{position:relative;height:380px;border-radius:22px;background:#070B1C;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame{position:relative;width:200px;height:200px}
.cn{position:absolute;width:22px;height:22px;border-color:#2BD279;border-style:solid;border-width:0}
.cn.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:6px}
.cn.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:6px}
.cn.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:6px}
.cn.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:6px}
.scanline{position:absolute;left:10px;right:10px;height:2px;background:#2BD279;box-shadow:0 0 12px #2BD279;animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%{top:12px}50%{top:186px}100%{top:12px}}
.holdbtn{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.holdfill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28)}
</style>
<style>
html,body{height:100%}
body{margin:0;background:#E9E6DF;display:flex;align-items:center;justify-content:center;overflow:hidden}
#phone{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(20,24,40,.25);flex:none;transform-origin:center center}
#mount{width:100%;height:100%}
@media (max-width:500px){
  body{background:#F6F4EF;display:block}
  #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .app{width:100vw !important;height:100vh !important;height:100dvh !important}
  .nav{padding-bottom:env(safe-area-inset-bottom);height:calc(76px + env(safe-area-inset-bottom))}
  .scroll{padding-top:calc(18px + env(safe-area-inset-top))}
}
</style>
</head>
<body>
<div id="phone"><div id="mount"></div></div>
<template id="tpl">

<div class="app">

<!-- ============ HOME ============ -->
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div class="scroll">
  <div class="hdr">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #E6E8F5; color: #1F2B5B; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; flex: none">P</div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 16px; font-weight: 600">Hi, Ploy</div>
      <div class="row muted" style="font-size: 11px; gap: 4px"><svg class="ico xs" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"></path></svg>Ideo Q Sukhumvit 36 · Lobby B</div>
    </div>
    <div style="display: flex; background: #EDEBE5; border-radius: 999px; padding: 2px">
      <button onClick="{{ setEN }}" class="{{ enCls }}">EN</button>
      <button onClick="{{ setTH }}" class="{{ thCls }}">TH</button>
    </div>
    <button class="back" aria-label="Notifications" style="position: relative"><svg class="ico s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg><span style="position: absolute; top: 4px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #E5484D; border: 1.5px solid #fff"></span></button>
  </div>

  <!-- Services (first) -->
  <div class="between">
    <h2 class="sec">Services</h2>
    <span class="row muted" style="font-size: 11px; gap: 4px; background: #EDEBE5; padding: 3px 8px; border-radius: 999px"><svg class="ico xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 12h6"></path></svg>≤ 3 kg / bag</span>
  </div>
  <div class="svcgrid">
    <button class="svc" onClick="{{ pick0 }}">
      <span class="ib"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.2"></circle><path d="M7.5 6.5h2"></path></svg></span>
      <span class="price">฿199</span>
      <span class="nm">Wash &amp; Dry</span>
    </button>
    <button class="svc" onClick="{{ pick1 }}">
      <span class="ib"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3"></path><path d="M3 12h15a3 3 0 1 1-3 3"></path><path d="M3 16h7"></path></svg></span>
      <span class="price">฿249</span>
      <span class="nm">Wash, Dry &amp; Fold</span>
    </button>
    <button class="svc pop" onClick="{{ pick2 }}">
      <span class="ib"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5a2 2 0 1 1 2-2c0 1.2-2 1.5-2 3V9l-8.4 6.3A1 1 0 0 0 4.2 17h15.6a1 1 0 0 0 .6-1.7L12 9"></path></svg></span>
      <span class="price">฿399</span>
      <span><span class="nm" style="display: block">Wash, Dry &amp; Iron</span><span class="sub" style="display: block">✦ Popular</span></span>
    </button>
    <button class="svc" onClick="{{ pick3 }}">
      <span class="ib"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg></span>
      <span class="price">฿150</span>
      <span><span class="nm" style="display: block">First bag</span><span class="sub" style="display: block">Wash, Dry &amp; Fold</span></span>
    </button>
  </div>

  <!-- Promotion -->
  <h2 class="sec" style="margin-top: 4px">Promotion</h2>
  <button class="card row" onClick="{{ pickUsual }}" style="padding: 12px 14px; text-align: left; cursor: pointer; width: 100%">
    <span style="width: 38px; height: 38px; border-radius: 10px; background: #FFF1E6; color: #E8590C; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex: none"><svg class="ico s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 10.5 11C10.5 7 12 2 12 2z"></path></svg>3</span>
    <span style="flex: 1">
      <span style="display: block; font-size: 14px; font-weight: 600; color: #1A1F36">It's your laundry night</span>
      <span class="row" style="font-size: 12px; color: #D6336C; gap: 4px; font-weight: 500"><svg class="ico xs" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path></svg>My usual · ฿399</span>
    </span>
    <span style="width: 40px; height: 40px; border-radius: 50%; background: #1F2B5B; color: #fff; display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg></span>
  </button>
  <div class="promo">
    <div class="navy" style="flex: none; width: 160px; height: 86px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 14px">
      <span style="width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.5 19H7a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 11 4 4 0 0 1 17.5 19z"></path></svg></span>
      <span><span style="display: block; font-size: 10px; letter-spacing: .5px; opacity: .8">RAINY20</span><span style="display: block; font-size: 13px; font-weight: 600">฿20 off this week</span></span>
    </div>
    <div style="flex: none; width: 160px; height: 86px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 14px; background: #E3F5E8; border: 1px solid #C9EBD3">
      <span style="width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #167A41; display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg></span>
      <span><span style="display: block; font-size: 10px; letter-spacing: .5px; color: #167A41; font-weight: 600">NEW</span><span style="display: block; font-size: 13px; font-weight: 600; color: #1A1F36">Pay in one tap</span></span>
    </div>
  </div>

  <!-- Locker Availability -->
  <h2 class="sec" style="margin-top: 4px">Locker Availability</h2>
  <div class="card" style="padding: 14px">
    <div class="between">
      <div class="row">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #F1F0EC; color: #1F2B5B; display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 12h16M14 7.5h2M14 16.5h2"></path></svg></span>
        <span><span style="display: block; font-size: 14px; font-weight: 600">Lobby B</span><span class="muted" style="display: block; font-size: 11px">Ground floor next to lift B</span></span>
      </div>
      <div class="row" style="gap: 8px">
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px">
          <span class="lk free"></span><span class="lk"></span><span class="lk free"></span><span class="lk"></span><span class="lk free"></span><span class="lk"></span>
          <span class="lk"></span><span class="lk free"></span><span class="lk"></span><span class="lk"></span><span class="lk free"></span><span class="lk"></span>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: #167A41">5/12</span>
      </div>
    </div>
    <div class="row" style="margin-top: 12px; background: #F6F4EF; border-radius: 10px; padding: 8px 10px; font-size: 11px; gap: 6px; flex-wrap: wrap">
      <svg class="ico xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>Drop by 6:00 AM</span><span class="muted">›</span>
      <svg class="ico xs" viewBox="0 0 24 24" fill="#1FAE5B" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6" stroke="#fff" stroke-width="2.2" fill="none"></path></svg>
      <span>Ready Same Evening</span>
      <span style="color: #167A41; font-weight: 600; margin-left: auto">On Time</span>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ SCAN ============ -->
<sc-if value="{{ isScan }}" hint-placeholder-val="{{ false }}">
<div class="dark" style="position: absolute; inset: 0; padding: 18px; display: flex; flex-direction: column; gap: 16px">
  <div class="between">
    <button class="back dk" onClick="{{ back }}" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div class="row" style="gap: 6px; font-size: 15px; font-weight: 600"><svg class="ico s" viewBox="0 0 24 24" fill="#F5B301" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>Scan Locker</div>
    <button class="back dk" aria-label="Flashlight"><svg class="ico s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>
  </div>
  <div class="vf" style="flex: 1">
    <div class="frame">
      <span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>
      <sc-if value="{{ notScanned }}" hint-placeholder-val="{{ true }}"><span class="scanline"></span></sc-if>
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{ scanned }}" hint-placeholder-val="{{ false }}">

class Component extends DCLogic {

})();
